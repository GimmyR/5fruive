<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
	<body>
		<nav th:fragment="copy" class="offcanvas-md offcanvas-start col-md-3 col-lg-2 col-xxl-1 mt-md-5 pt-md-2 border" id="navigation">
			<div class="offcanvas-header">
				<h5 class="offcanvas-title" id="offcanvasLabel">Menu</h5>
			    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#navigation" aria-label="Close"></button>
			</div>
			<div class="offcanvas-body nav flex-column text-center" th:with="options = ${ {'dashboard', 'roles', 'accounts', 'categories', 'provinces', 'products', 'purchases'} }">
				<a th:each="option : ${ options }" th:href="${ '/bo/' + option }" th:text="${ #strings.capitalize(option) }" th:class="${ 'nav-link py-3 border-top border-bottom ' + (active == option? 'text-primary disabled' : 'text-dark') }"></a>
			</div>
		</nav>
	</body>
</html>
