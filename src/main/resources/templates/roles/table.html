<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
	<body>
		<div class="col-lg-6 col-xl-5 col-xxl-4 pt-4 pt-md-5 px-3 px-md-4 bo-main-content" th:fragment="copy">
			<table class="table table-bordered">
				<thead>
					<tr>
						<th>ID</th>
						<th>Name</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="role : ${ roles }">
						<td th:text="${ role.id }">Role ID</td>
						<td th:text="${ role.name }">Role name</td>
					</tr>
				</tbody>
			</table>
		</div>
	</body>
</html>
