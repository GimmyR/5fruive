<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
	<body>
		<th:block th:fragment="copy">
			<script src="/webjars/chartjs/4.4.3/dist/chart.umd.js"></script>
			<script th:inline="javascript">
				const labels = /*[[${labels}]]*/ [];
				const values = /*[[${values}]]*/ [];
				const ctx = document.getElementById('fruive-chart');
				
				const data = {
					labels: labels,
					datasets: [{
						label: 'Purchases',
						data: values,
						hoverOffset: 4
					}]
				};
				
				const config = {
					type: 'doughnut',
					data: data
				};
				
				const fruiveChart = new Chart(ctx, config);
			</script>
		</th:block>
	</body>
</html>
