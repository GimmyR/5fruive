<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
	<body>
		<div th:fragment="copy" class="min-vh-100 mt-5 pt-5">
			<div class="d-flex flex-row justify-content-center">
				<div class="col-3 card p-5">
					<h1 class="fs-4">Dear <span th:text="${ auth.name }"></span></h1>
					<form th:action="@{ /payment }" method="post" th:object="${cardForm}">
						<div class="mt-2 mb-4">
							<label for="code" class="form-label">Please refer your card code here :</label>
							<input type="text" class="form-control" th:field="*{code}" placeholder="XXXX - XXXX - XXXX - XXXX">
							<div th:if="${#fields.hasErrors('code')}" th:errors="*{code}" id="codeHelp" class="form-text px-2 text-danger">Unknown error. Please contact an administrator.</div>
						</div>
						<div class="d-flex flex-row justify-content-end">
							<button type="submit" class="btn btn-warning">
								<i class="bi bi-credit-card-2-back me-2"></i>Buy products
							</button>
						</div>
					</form>
				</div>
			</div>
		</div>
	</body>
</html>
