<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
	<body>
		<div th:fragment="copy" class="min-vh-100" th:if="${ errorMessage != null }">
			<div class="min-vh-100 d-flex flex-column justify-content-center align-items-center">
				<h1 th:text="${ status }" class="http-status text-center">ERROR CODE</h1>
				<h2 th:text="${ errorMessage }" class="error-message text-center">ERROR MESSAGE</h2>
			</div>
		</div>
	</body>
</html>
