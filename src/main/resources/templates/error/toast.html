<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
	<body>
		<div th:fragment="copy" class="toast-container position-fixed bottom-0 end-0 p-3">
  			<div id="liveToast" class="toast align-items-center text-bg-danger" role="alert" aria-live="assertive" aria-atomic="true">
  				<div class="d-flex" data-bs-theme="dark">
    				<div id="toast-content" class="toast-body">
      					Unknown error. Please contact an admin.
    				</div>
    				<button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
  				</div>
			</div>
		</div>
	</body>
</html>
