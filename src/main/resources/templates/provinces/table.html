<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
	<body>
		<div class="d-flex flex-row justify-content-center pt-4 pt-lg-5 px-3 px-lg-4 bo-main-content" th:fragment="copy">
			<div class="d-flex flex-column col-12 col-lg-6 col-xl-5 col-xxl-4">
				<div class="d-flex flex-row justify-content-end mb-3">
					<a href="#" class="btn btn-outline-secondary pe-3">
						<i class="bi bi-plus-lg me-1"></i>Add province
					</a>
				</div>
				<table class="table table-bordered table-hover text-center align-middle">
					<thead>
						<tr>
							<th>ID</th>
							<th>Name</th>
							<th></th>
							<th></th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="province : ${ provinces }">
							<td th:text="${ province.id }">Category ID</td>
							<td th:text="${ province.name }">Category name</td>
							<td class="col-2">
								<button type="button" class="btn btn-warning">Edit</button>
							</td>
							<td class="col-1">
								<button type="button" class="btn btn-dark">Remove</button>
							</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
	</body>
</html>
