<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
	<body>
		<div th:fragment="copy" th:if="${ purchase != null }" class="container min-vh-100 mt-5 pt-5">
			<h1 class="fs-3 mb-5"><span class="text-decoration-underline">Purchase date</span> : <span th:text="${ #temporals.format(purchase.purchaseDate, 'dd-MM-yyyy HH:mm') }" class="ms-3"></span></h1>
			<table class="table table-bordered">
				<thead>
					<tr>
						<th>Product name</th>
						<th>Amount</th>
						<th>Price</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="detail : ${ purchase.details }">
						<td th:text="${ detail.product.name }"></td>
						<td th:text="${ detail.amount + ' ' + detail.product.unit }"></td>
						<td th:text="${ detail.price + ' Ar' }"></td>
					</tr>
					<tr>
						<th>Total</th>
						<th th:text="${ #aggregates.sum(purchase.details.![amount]) + ' ' + purchase.details[0].product.unit }">Total amount</th>
						<th th:text="${ #aggregates.sum(purchase.details.![price]) + ' Ar' }">Total price</th>
					</tr>
				</tbody>
			</table>
		</div>
	</body>
</html>
