<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
	<body>
		<div th:fragment="copy" class="min-vh-100 mt-5 pt-5">
			<div class="d-flex flex-row justify-content-center">
				<div class="card col-lg-4 col-xl-3 p-5">
					<form th:action="@{ /sign-in }" method="post">
						<div class="mb-3">
							<label for="username" class="form-label">Username</label>
							<input type="text" id="username" class="form-control" name="username" placeholder="e.g. johndoe">
						</div>
						<div class="mb-4">
							<label for="password" class="form-label">Password</label>
							<input type="password" id="password" class="form-control" name="password" placeholder="&#9679;&#9679;&#9679;&#9679;&#9679;&#9679;&#9679;">
						</div>
						<div class="d-flex flex-row justify-content-end">
							<button type="submit" class="btn btn-warning col-12">Sign in</button>
						</div>
						<div class="mt-4">
							<p>I'm sorry. I didn't create a page to sign up. If you want to sign in, you can go to my <a href="https://github.com/GimmyR/5fruive">GitHub</a> profile and search the data.sql.</p>
						</div>
					</form>
				</div>
			</div>
		</div>
	</body>
</html>
