<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
	<body>
		<div th:fragment="copy" class="container min-vh-100 mt-5 pt-5">
			<div th:if="${ products == null || amounts == null }" class="d-flex flex-row justify-content-center align-items-center border pt-2" style="height: 100px">
				<p>No products in your cart.</p>
			</div>
			<form th:if="${ products != null && amounts != null }" class="col-12 col-lg-6 offset-lg-3">
				<h1 class="mb-5 text-center">Manage your cart</h1>
				<div th:each="product, iter : ${ products }" class="mb-3">
					<label th:for="${ 'in-cart-' + product.id }" th:text="${ product.name + ' (' + product.unit + ')' }" class="form-label">Product name (unit)</label>
					<div class="d-flex flex-row">
						<input type="number" th:id="${ 'in-cart-' + product.id }" class="form-control" th:value="${ amounts[iter.index] }">
						<button type="button" th:id="${ 'button-remove-product-' + product.id }" class="btn btn-danger ms-2">Remove</button>
					</div>
					<div class="form-text ms-2" th:text="${ product.price + ' Ar / ' + product.unit }">Product price / product unit</div>
				</div>
				<div class="mb-5">
					<label for="total-price" class="form-label text-danger">Total price (Ar)</label>
					<input type="number" id="total-price" class="form-control" th:value="${ totalPrice }">
				</div>
				<div class="d-flex flex-row align-items-center pt-4" th:if="${ products != null && amounts != null }">
					<div class="col-4">
						<button type="button" id="button-reset-cart" class="btn btn-secondary">
							<i class="bi bi-arrow-clockwise me-1"></i>Reset cart
						</button>
					</div>
					<div class="col-8 d-flex flex-row align-items-center justify-content-end">
						<button type="button" id="button-save-cart" class="btn btn-primary me-2">
							<i class="bi bi-floppy me-2"></i>Save cart
						</button>
						<button type="button" class="btn btn-warning">
							<i class="bi bi-credit-card-2-back me-2"></i>Buy products
						</button>
					</div>
				</div>
			</form>
		</div>
	</body>
</html>
