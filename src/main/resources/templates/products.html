<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
	<head>
		<meta charset="UTF-8">
		<title>Get all products</title>
	</head>
	<body>
		<div>
			<p>All products :</p>
			<ul>
				<li th:each="product : ${ products }">
					<span th:text="${ product.name }">Product name</span>
				</li>
			</ul>
		</div>
	</body>
</html>
