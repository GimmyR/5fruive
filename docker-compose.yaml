services:

  db:
    image: postgres:trixie
    container_name: postgres-5fruive
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - ./appdata/postgres:/var/lib/postgresql


  web:
    build: .
    container_name: web-5fruive
    depends_on:
        - db
    ports:
        - "8080:8080"
    environment:
        DB_HOST: ${DB_HOST}
        DB_PORT: ${DB_PORT}
        DB_NAME: ${DB_NAME}
        DB_USER: ${DB_USER}
        DB_PASSWORD: ${DB_PASSWORD}