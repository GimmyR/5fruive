services:

  db:
    image: postgres:trixie
    container_name: postgres-5fruive
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: fruive
    ports:
      - "5432:5432"
    volumes:
      - ./appdata/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d fruive"]
      interval: 5s
      timeout: 5s
      retries: 5


  web:
    build: .
    container_name: web-5fruive
    depends_on:
        db:
          condition: service_healthy
    ports:
        - "8080:8080"
    environment:
        DB_URL: jdbc:postgresql://db:5432/fruive
        DB_USER: admin
        DB_PASSWORD: 123