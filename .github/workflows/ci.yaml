name: 5Fruive

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # -------------------------
      # 1) TEST PHASE (TestContainers)
      # -------------------------
      - name: Build CI images
        run: docker compose --profile ci build

      - name: Run backend tests (TestContainers)
        run: docker compose --profile ci run --rm web-ci

      # -------------------------
      # 2) BUILD PHASE (dev images)
      # -------------------------
      - name: Build runtime images
        run: docker compose --profile dev build